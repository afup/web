name: CI

# Les branches sont testées par leur pull request : un push sur une branche de PR ne relance pas la CI
# une seconde fois sur le même commit. master reste testé à chaque push.
on:
  push:
    branches: [master]
  pull_request:

# Un nouveau commit sur une PR annule les runs encore en cours de son commit précédent ; sur master,
# chaque commit va au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  php_version: "8.5"
  # Jobs Docker : nom de projet fixe pour que compose retrouve les images taguées par bake
  # (web-<service>), surcharges CI (MySQL en mémoire) et base de test démarrée en amont du Makefile.
  COMPOSE_PROJECT_NAME: web
  COMPOSE_FILE: compose.yml:compose.ci.yml
  TEST_DB_SERVICES: ""

jobs:
  unit:
    name: "Unit tests"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}

      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: "--no-scripts"

      - name: Tests - Unit
        run: ./bin/phpunit --testsuite unit

  lint:
    name: "Linter"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}

      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: "--no-scripts"

      - name: Tests - CS Fixer
        run: ./bin/php-cs-fixer fix --dry-run -vv

  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}

      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: "--no-scripts"

      - name: PHPStan
        run: php ./bin/phpstan

  functional-no-js-shard:
    name: "Functional tests (no JS) - shard ${{ matrix.shard }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Une entrée par ligne de tests/behat/ci-shards
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      # MySQL s'initialise pendant la construction des images
      - name: Start test database
        run: docker compose up -d --build dbtest

      - name: Select Behat features of the shard
        id: shard
        run: |
          paths=$(.github/scripts/behat-shard.sh ${{ matrix.shard }} ${{ strategy.job-total }})
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build images with GHA cache
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yml
            compose.override.yml-dist
          targets: |
            apachephp
            apachephptest
          load: true
          set: |
            apachephp.tags=web-apachephp:latest
            apachephp.cache-from=type=gha,scope=apachephp-full
            apachephp.cache-to=type=gha,scope=apachephp-full,mode=max
            apachephptest.tags=web-apachephptest:latest
            apachephptest.cache-from=type=gha,scope=apachephp-full
            apachephptest.cache-to=type=gha,scope=apachephp-full,mode=max

      - name: Delete symfony cache
        run: rm -rf var/cache/test

      - name: Tests - Functional (no JS)
        run: make test-functional-no-js BEHAT_PATHS="${{ steps.shard.outputs.paths }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Functional tests (no JS) - shard ${{ matrix.shard }} - deprecated log - full
          path: var/logs/test.deprecations.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Functional tests (no JS) - shard ${{ matrix.shard }} - deprecated log - report
          path: var/logs/test.deprecations_grouped.log

  # Garde un check unique « Functional tests (no JS) » quel que soit le nombre de shards
  functional-no-js:
    name: "Functional tests (no JS)"
    runs-on: ubuntu-22.04
    needs: functional-no-js-shard
    if: always()

    steps:
      - name: Check shards result
        run: test "${{ needs.functional-no-js-shard.result }}" = "success"

  functional-js:
    name: "Functional tests (JS)"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      # MySQL s'initialise pendant la construction des images
      - name: Start test database
        run: docker compose up -d --build dbtest

      - uses: docker/setup-buildx-action@v4

      - name: Build images with GHA cache
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yml
            compose.override.yml-dist
          targets: |
            apachephp
            apachephptest
          load: true
          set: |
            apachephp.tags=web-apachephp:latest
            apachephp.cache-from=type=gha,scope=apachephp-full
            apachephp.cache-to=type=gha,scope=apachephp-full,mode=max
            apachephptest.tags=web-apachephptest:latest
            apachephptest.cache-from=type=gha,scope=apachephp-full
            apachephptest.cache-to=type=gha,scope=apachephp-full,mode=max

      - name: Delete symfony cache
        run: rm -rf var/cache/test

      - name: Tests - Functional (JS)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: make test-functional-js

      - uses: actions/upload-artifact@v7
        with:
          name: Functional tests (JS) - deprecated log - full
          path: var/logs/test.deprecations.log

      - uses: actions/upload-artifact@v7
        with:
          name: Functional tests (JS) - deprecated log - report
          path: var/logs/test.deprecations_grouped.log

  integration:
    name: "Integration tests"
    runs-on: ubuntu-22.04
    env:
      APACHEPHPTEST_TARGET: base

    steps:
      - uses: actions/checkout@v6

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      # MySQL s'initialise pendant la construction des images
      - name: Start test database
        run: docker compose up -d --build dbtest

      - uses: docker/setup-buildx-action@v4

      - name: Build images with GHA cache
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yml
            compose.override.yml-dist
          targets: |
            apachephptest
          load: true
          set: |
            apachephptest.tags=web-apachephptest:latest
            apachephptest.cache-from=type=gha,scope=apachephp-base
            apachephptest.cache-to=type=gha,scope=apachephp-base,mode=max

      - name: Delete symfony cache
        run: rm -rf var/cache/test

      - name: Tests - Integration
        run: make test-integration-ci

  rector:
    name: "Rector"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}

      - uses: ramsey/composer-install@4.0.0
        with:
          composer-options: "--no-scripts"

      - name: Rector
        run: php ./bin/rector
