home:
  path: /home
  defaults: { _controller: AppBundle\Controller\Website\Global\HomeAction }
  options:
    sitemap: true

old_home_redirect:
  path: /
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: 'home'
    permanent: false

become_sponsor_generic:
  path: /become-sponsor
  defaults: { _controller: AppBundle\Controller\Event\Lead\BecomeSponsorGenericAction }

become_sponsor_generic_thanks:
  path: /become-sponsor/thank-you
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
  defaults:
    template: 'event/sponsorship_file/thanks.html.twig'

sitemap:
  path: /plan-du-site
  defaults: { _controller: AppBundle\Controller\Website\Global\HtmlSitemapAction }
  options:
    sitemap: true
