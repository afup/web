talks_list:
  path: /
  defaults: { _controller: AppBundle\Controller\Website\Talks\ListAction }
  options:
    sitemap:
      section: talks
      changefreq: monthly

# Avant talks_show (dont l'id est numérique) : /{id}-{slug} ne doit jamais capturer une page speaker ou événement.
talks_speakers:
  path: /speakers/
  defaults: { _controller: AppBundle\Controller\Website\Talks\SpeakerListAction }
  options:
    sitemap:
      section: talks
      changefreq: monthly

talks_speaker:
  path: /speakers/{slug}
  defaults: { _controller: AppBundle\Controller\Website\Talks\SpeakerShowAction }

talks_events:
  path: /evenements/
  defaults: { _controller: AppBundle\Controller\Website\Talks\EventListAction }
  options:
    sitemap:
      section: talks
      changefreq: monthly

talks_event:
  path: /evenements/{path}
  defaults: { _controller: AppBundle\Controller\Website\Talks\EventShowAction }

talks_show:
  path: /{id}-{slug}
  defaults: { _controller: AppBundle\Controller\Website\Talks\ShowAction }
  requirements: { id: '\d+' }

talks_joindin:
  path: /{id}-{slug}/joindin
  defaults: { _controller: AppBundle\Controller\Website\Talks\JoindinAction }
