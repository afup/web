admin_antennes_list:
    path: /
    defaults: {_controller: AppBundle\Controller\Admin\Antennes\AntenneListAction}

admin_antennes_add:
    path: /add
    defaults: {_controller: AppBundle\Controller\Admin\Antennes\AntenneAddAction}

admin_antennes_edit:
    path: /edit/{code}
    defaults: {_controller: AppBundle\Controller\Admin\Antennes\AntenneEditAction}
    requirements:
        code: '[a-z0-9-]+'
