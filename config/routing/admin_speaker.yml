admin_speaker_export:
  path: /export
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\ExportAction}

admin_speaker_list:
  path: /
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerListAction}

admin_speaker_add:
  path: /add
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerAddAction}

admin_speaker_delete:
  path: /delete
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerDeleteAction}

admin_speaker_edit:
  path: /edit
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerEditAction}

admin_speaker_link_gravatar:
  path: /link-gravatar
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerLinkGravatarAction}

admin_speaker_register:
  path: /register
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerRegisterAction}

admin_speaker_pick:
  path: /pick
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\SpeakerPickAction}

admin_speaker_personne:
  path: /personne
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\PersonneConferencierAction}

admin_speaker_personne_create:
  path: /personne/create
  methods: [POST]
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\PersonneConferencierCreateAction}

admin_speaker_personne_attach:
  path: /personne/attach
  methods: [POST]
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\PersonneConferencierAttachAction}

admin_speaker_personne_detach:
  path: /personne/detach
  methods: [POST]
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\PersonneConferencierDetachAction}

admin_speaker_personne_merge:
  path: /personne/merge
  methods: [POST]
  defaults: {_controller: AppBundle\Controller\Admin\Speaker\PersonneConferencierMergeAction}
